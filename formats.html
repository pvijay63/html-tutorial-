<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Bold Text-->
     <b>Bold</b>
     <strong>Bold</strong>
     <!-- italic Text-->
      <i>Italic </i>
      <em>Italic</em>
      <!-- Marking the Text -->
       <mark>Mark with Yellow</mark>
     <!--Deleting the Text-->
     <del>Delete</del>
     <strike>Delete</strike>
     <!--Big Text-->
     <big>Big</big>
     <!--Small Text-->
     <small>Small</small>
     <!--Underlining the Text-->
     <ins>Underlines the Text</ins>
     <!--Subsripct Text-->
     <p>This <sub>Subscript</sub></p>
     <!--SuperScript Text-->
     <p>This <sup>SuperScript</sup></p>
</body>
</html>
