<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        <!-- 
            css Psuedo classes;
            CSS pseudo-class is a keyword added to a selector that specifies a special state of the selected element —
             something that can’t be described just by the element’s name, 
            class, or I.
            The link before opening ( Unvisited link )-->
        a:link
        {
            color: blanchedalmond;
            background-color: transparent;
            text-decoration: none;
        }
        <!--After the link has been clicked-->
        a:visited{
            color: aquamarine;
            background-color: transparent;
            text-decoration: none;
        }
       <!--Mouse is over the link-->
        a:hover{
            color: goldenrod;
            background-color: transparent;
            text-decoration: none;
        }
        <!--Link is being clicked-->
        a:active{
            color: brown;
            background-color: transparent;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <P><a href="https://www.google.com">Google</a></P>
    
</body>
</html>
